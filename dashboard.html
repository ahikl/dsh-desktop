<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f1420;
        color: #e8ecf4;
      }
      main { max-width: 34rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 1rem; }
      p { line-height: 1.6; color: #a9b4c6; margin: 0 0 0.5rem; }
      code { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #7aa2ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>DeepSeek Harness</h1>
      <p>No Web server is reachable, so this window shows the bundled dashboard.</p>
      <p>Run the desktop surface over the Web UI with <code>dsh --profile desktop</code>, or pass an explicit target with <code>--url</code>.</p>
    </main>
  </body>
</html>
